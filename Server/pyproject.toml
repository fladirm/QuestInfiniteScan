[project]
name = "quest-infinite-server"
version = "0.1.0"
description = "Local durable DiffSoup worker service for QuestInfiniteScan"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "QuestInfiniteScan contributors" }]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quest_infinite_server"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

